name: Idea / feature request
description: Open this before writing code — we'd rather point you at the right seam than review a PR that fights the design
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do and where it gets stuck today.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: The shape of a fix (optional)
      description: If you have one in mind. It's fine not to.
    validations:
      required: false
  - type: dropdown
    id: willing
    attributes:
      label: Would you want to build it?
      options:
        - "Yes, pending a green light"
        - "No — just flagging it"
    validations:
      required: true
